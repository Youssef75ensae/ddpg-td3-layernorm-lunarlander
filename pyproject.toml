[project]
name = "ddpg-td3-layernorm-lunarlander"
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "gymnasium",
    "ipywidgets",
    "jupyter",
    "jupyterlab",
    "matplotlib",
    "mazemdp",
    "numpy",
    "omegaconf",
    "optuna",
    "pandas>=3.0.6",
    "pyyaml",
    "rl-mind",
    "scipy",
    "torch",
    "tqdm",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
